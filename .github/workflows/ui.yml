name: UI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  performance:
    name: VFO performance regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run test:performance

  ui:
    name: Components and Storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Use the runner's preinstalled Chrome to avoid hanging on apt/browser downloads.
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ui
      - run: npm run test:storybook
      - run: npm run build:storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: storybook-static
